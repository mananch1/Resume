<html lang="en">
<head>

  <style>
    :root {
      --bg-color: #0f172a;
      --header-bg: #1e293b;
      --card-bg: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: rgba(37, 99, 235, 0.15);
      --border-color: #334155;
      --btn-secondary-bg: #334155;
      --btn-secondary-hover: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    header {
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      background-color: var(--accent-light);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.3);
    }

    /* Actions & Links */
    .actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.85rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 0.5rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease-in-out;
      line-height: 1;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--btn-secondary-bg);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background-color: var(--btn-secondary-hover);
    }

    .icon-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.5rem;
      background-color: var(--btn-secondary-bg);
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.15s ease-in-out;
    }

    .icon-link:hover {
      background-color: var(--btn-secondary-hover);
      color: #ffffff;
    }

    .divider {
      width: 1px;
      height: 1.5rem;
      background-color: var(--border-color);
      margin: 0 0.25rem;
    }

    /* Mobile Alert Bar */
    .mobile-banner {
      display: none;
      background: linear-gradient(90deg, #1e3a8a, #1d4ed8);
      color: #ffffff;
      padding: 0.65rem 1rem;
      text-align: center;
      font-size: 0.875rem;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
    }

    .mobile-banner a {
      color: #ffffff;
      font-weight: 700;
      text-decoration: underline;
    }

    /* Main PDF Viewer Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      height: calc(100vh - 65px);
    }

    .pdf-container {
      width: 100%;
      max-width: 1050px;
      height: 100%;
      background-color: #334155;
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .pdf-frame {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #525659;
    }

    /* Fallback UI if PDF cannot be rendered */
    .pdf-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      padding: 2rem;
      gap: 1rem;
      color: var(--text-secondary);
    }

    .pdf-fallback h2 {
      color: var(--text-primary);
      font-size: 1.5rem;
    }

    /* Footer */
    footer {
      background-color: var(--header-bg);
      border-top: 1px solid var(--border-color);
      padding: 0.6rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-secondary);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    footer a {
      color: #60a5fa;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .badge {
        display: none;
      }
      .mobile-banner {
        display: flex;
      }
      main {
        padding: 0.5rem;
        height: calc(100vh - 120px);
      }
      .pdf-container {
        border-radius: 0.5rem;
      }
      .btn-text-hide {
        display: none;
      }
    }
  </style>
</head>
<body>

  </header>

  <!-- Mobile Notification Banner -->

    <span>📱 On mobile? For the best view, <a href="Resume.pdf" target="_blank">open the PDF directly</a>.</span>

  <!-- Document Viewer Area -->

      <object data="Resume.pdf#view=FitH" type="application/pdf" class="pdf-frame" id="pdfObject">

  <!-- Footer -->
  <footer>
    <span>Auto-compiled from LaTeX source via GitHub Actions</span>
    <span>Source: <a href="https://github.com/mananch1/Resume" target="_blank" rel="noopener noreferrer">github.com/mananch1/Resume</a></span>
  </footer>

  <script>
    function printResume() {
      const obj = document.getElementById('pdfObject');
      const frame = document.getElementById('pdfFrame');
      try {
        if (frame && frame.contentWindow) {
          frame.contentWindow.focus();
          frame.contentWindow.print();
          return;
        }
      } catch (e) {
        console.warn('Iframe print failed, falling back to window.print()', e);
      }
      window.print();
    }
  </script>
